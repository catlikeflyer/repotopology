[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repotopology"
version = "0.1.0"
description = "Agentic codebase comprehension and 3-tiered context-pruning framework backed by FastMCP for Gemma 4 E4B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
colab = [
    "transformers>=4.48.0",
    "peft>=0.14.0",
    "trl>=0.14.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.45.0",
    "scipy>=1.13.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
repotopology-server = "repotopology.server:main"
repotopology-eval = "repotopology.evaluator:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
